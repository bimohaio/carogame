<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Hello ajinomoto</title>
</head>
<body>
    <script src="./main.js" defer></script>
    <div id="app">
        <div class="container">
            <div class="input_area">
                <div class="input_group">
                    <label for="row_num">Row Number</label>
                    <input type="number" name="row_num" id="row_num" class="input_num" value="20">
                </div>
                <div class="input_group">
                    <label for="row_num">Column Number</label>
                    <input type="number" name="row_num" id="col_num" class="input_num" value="20">
                </div>
                <div class="button_action">
                    <input type="button" value="Reset" id="generate_btn">
                </div>
                <div class="leader_board">
                    <h2>Match</h2>
                    <div class="user_group">
                        <div class="user_item">
                            <div class="avatar">
                                <img src="./icons/animals/parrot-icon.svg" alt="">
                                <a href="#">Parrot</a>
                            </div>
                            <div class="caro_type">
                                <img src="./icons/circle-icon.svg" class="caro_icon" alt="">
                            </div>
                        </div>
                        <div class="score">
                            <p class="score" id="score">0-0</p>
                        </div>
                        <div class="user_item">
                            <div class="avatar">
                                <img src="./icons/animals/dog-icon.svg" alt="">
                                <a href="#">Dog</a>
                            </div>
                            <div class="caro_type">
                                <img src="./icons/cross-icon.svg" class="caro_icon" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="output_area">
                <h2 class="leader_board_title">Caro board</h2>
                <div id="caro_app"></div>
            </div>
        </div>
    </div>
</body>
</html>
